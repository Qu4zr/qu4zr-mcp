name: Publish to npm

# The only way qu4zr-mcp reaches npm. A release tag (vX.Y.Z) is pushed here by the mirror job of
# qu4zr's main repository; this workflow builds and tests that exact commit and publishes it with
# npm trusted publishing (OIDC, no token anywhere). Because this repository is public, npm also
# records a provenance attestation: anyone can check that the tarball was built from this commit,
# by this workflow.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # exchanged by npm for a one-time publish credential, and signs the provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships with npm 10.
      - name: Update npm
        run: npm install -g npm@11

      - name: Tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)." >&2
            exit 1
          fi

      # The package must never run code at install time.
      - name: No install-time scripts
        run: |
          node -e "
            const s = require('./package.json').scripts || {};
            const bad = ['preinstall', 'install', 'postinstall', 'prepare', 'prepublish'].filter(k => k in s);
            if (bad.length) { console.error('Install-time scripts are not allowed: ' + bad.join(', ')); process.exit(1); }
          "

      - name: Install
        run: npm ci

      # A known high or critical advisory in a runtime dependency stops the release.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
